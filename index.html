<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTE Class Championship</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>

<body>

<div id="blueprint"></div>

<header>

    <div class="header-left">

        <h1>CTE CLASS CHAMPIONSHIP</h1>

        <p>
            Engineering • Architecture • Chico High School
        </p>

    </div>

    <div class="header-right">

        <div id="clock">
            8:32 AM
        </div>

        <button id="teacherMenu">
            ⚙
        </button>

    </div>

</header>


<!-- DAY TOGGLES -->

<section class="top-controls">

    <div class="toggle-group">

        <button id="goldDay" class="toggle active">
            🟨 Gold Day
        </button>

        <button id="redDay" class="toggle">
            🟥 Red Day
        </button>

    </div>


    <div class="toggle-group">

        <button id="regularSchedule" class="toggle active">
            Regular
        </button>

        <button id="wednesdaySchedule" class="toggle">
            Wednesday
        </button>

        <button id="dwsdSchedule" class="toggle">
            DWSD
        </button>

    </div>

</section>



<!-- CLASS TABS -->

<nav id="classTabs">

    <!-- Generated by JavaScript -->

</nav>



<main>

    <!-- MAIN CARD -->

    <section id="mainCard">

        <h2 id="classTitle">
            Engineering 2
        </h2>

        <div id="score">

            0

        </div>

        <div class="pointsLabel">

            POINTS

        </div>

        <div class="progress">

            <div id="progressFill"></div>

        </div>

        <div id="constructionStage">

            📐 Planning

        </div>

        <div id="nextReward">

            Headphones While Working

        </div>

        <div id="rewardRemaining">

            75 Points Remaining

        </div>


        <div class="buttonGrid">

            <button class="pointButton" data-value="1">+1</button>
            <button class="pointButton" data-value="5">+5</button>
            <button class="pointButton" data-value="10">+10</button>
            <button class="pointButton" data-value="25">+25</button>

            <button class="pointButton negative" data-value="-1">-1</button>
            <button class="pointButton negative" data-value="-5">-5</button>

            <button id="undoButton">

                Undo

            </button>

        </div>

    </section>



    <!-- RIGHT SIDEBAR -->

    <aside>

        <section class="sidePanel">

            <h3>

                🏆 CTE Championship

            </h3>

            <ol id="leaderboard">

            </ol>

        </section>



        <section class="sidePanel">

            <h3>

                🎯 Unlocks

            </h3>

            <div id="rewardList">

            </div>

        </section>



        <section class="sidePanel">

            <h3>

                📊 Competition

            </h3>

            <p>

                Total Points

            </p>

            <h2 id="totalPoints">

                0

            </h2>

            <hr>

            <p>

                Current Leader

            </p>

            <h2 id="currentLeader">

                —

            </h2>

        </section>

    </aside>

</main>



<!-- Teacher Menu -->

<div id="teacherModal" class="hidden">

    <div class="modal">

        <h2>

            Teacher Controls

        </h2>

        <button id="monthlyReset">

            🔄 Monthly Reset

        </button>

        <button id="exportScores">

            📊 Export Scores

        </button>

        <button id="hallOfChampions">

            🏆 Hall of Champions

        </button>

        <button id="lockControls">

            🔒 Lock Controls

        </button>

        <button id="closeTeacher">

            Close

        </button>

    </div>

</div>



<script src="config.js"></script>
<script src="schedule.js"></script>
<script src="storage.js"></script>
<script src="ui.js"></script>
<script src="script.js"></script>

</body>
</html>
